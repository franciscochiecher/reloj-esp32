<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reloj ESP32 - Acceso remoto</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f3f5f8;color:#1f2937}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #0001}h1{margin-top:0}.big{font-size:58px;font-weight:700;text-align:center;margin:18px 0}.badge{text-align:center;font-weight:700;margin:8px}.online{color:#16803c}.offline{color:#b42318}button{border:0;border-radius:10px;padding:11px 15px;margin:4px;cursor:pointer;font-weight:700}input{padding:11px;border:1px solid #ccd2da;border-radius:9px;box-sizing:border-box}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:100px}.hidden{display:none}.alarm{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}.muted{color:#667085;font-size:.9rem}.error{color:#b42318}.success{color:#16803c}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="card">
    <h1>🔐 Reloj ESP32</h1>
    <p>Ingresá la clave para acceder al reloj desde Internet.</p>
    <input id="password" type="password" placeholder="Clave" style="width:100%">
    <button onclick="login()">Entrar</button><p id="loginMsg" class="error"></p>
  </div>

  <div id="app" class="hidden">
    <div class="card">
      <h1 id="title">⏱️ Hora del Reloj</h1>
      <div id="status" class="badge offline">● Desconectado</div>
      <div id="mode" class="badge">🕐 MODO RELOJ</div>
      <div id="display" class="big">--:--:--</div>
      <div class="muted" id="wifi">Wi-Fi: --</div>
    </div>

    <div class="card">
      <h2>⏱️ Cronómetro / Temporizador</h2>
      <div id="timerDisplay" class="big" style="font-size:42px">00:00:00</div>
      <div class="row">
        <input id="h" type="number" min="0" max="99" value="0" placeholder="Horas">
        <input id="m" type="number" min="0" max="59" value="5" placeholder="Minutos">
        <input id="s" type="number" min="0" max="59" value="0" placeholder="Segundos">
      </div>
      <div class="row" style="margin-top:8px">
        <button onclick="cmd('timer_start',{h:+h.value,m:+m.value,s:+s.value})">▶️ Iniciar</button>
        <button onclick="cmd('timer_pause',{})">⏸️ Pausar</button>
        <button onclick="cmd('timer_reset',{})">🔄 Reiniciar</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button onclick="cmd('display_mode',{mode:'clock'})">🕐 Modo Reloj</button>
        <button onclick="cmd('display_mode',{mode:'timer'})">⏱️ Modo Cronómetro</button>
      </div>
    </div>

    <div class="card">
      <h2>⏰ Alarmas</h2>
      <div class="row"><input id="alarmTime" type="time"><button onclick="addAlarm()">➕ Agregar</button></div>
      <div id="alarms" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <h2>🕐 Ajustar hora</h2>
      <input id="dateTime" type="datetime-local" style="width:100%">
      <button onclick="setTime()">Ajustar hora del ESP32</button>
      <p id="msg" class="muted"></p>
    </div>
  </div>
</div>
<script>
let auth='';
const $=id=>document.getElementById(id);
async function login(){
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});
  const d=await r.json(); if(!d.ok){$('loginMsg').textContent=d.error||'Error';return;}
  auth=d.token;$('login').classList.add('hidden');$('app').classList.remove('hidden');load();setInterval(load,1000);
}
async function api(url,opts={}){opts.headers={...(opts.headers||{}),Authorization:'Bearer '+auth,'Content-Type':'application/json'};const r=await fetch(url,opts);if(r.status===401)location.reload();return r.json();}
async function cmd(type,args){try{await api('/api/command',{method:'POST',body:JSON.stringify({type,args})});setTimeout(load,150)}catch(e){$('msg').textContent='No se pudo enviar el comando';}}
async function load(){try{const d=await api('/api/state');$('status').textContent=d.online?'● ESP32 conectado':'● ESP32 desconectado';$('status').className='badge '+(d.online?'online':'offline');$('wifi').textContent='Wi-Fi: '+(d.wifi||'--');$('display').textContent=d.modo==='timer'?d.display:d.hora;$('timerDisplay').textContent=d.timer?`${String(d.timer.horas).padStart(2,'0')}:${String(d.timer.minutos).padStart(2,'0')}:${String(d.timer.segundos).padStart(2,'0')}`:'00:00:00';$('mode').textContent=d.modo==='timer'?'⏱️ MODO CRONÓMETRO':'🕐 MODO RELOJ';$('title').textContent=d.modo==='timer'?'⏱️ Cronómetro / Temporizador':'⏱️ Hora del Reloj';renderAlarms(d.alarms||[])}catch(e){}}
function renderAlarms(a){$('alarms').innerHTML=a.length?a.map(x=>`<div class="alarm"><span>⏰ ${String(x.hora).padStart(2,'0')}:${String(x.minuto).padStart(2,'0')}</span><button onclick="cmd('del_alarm',{id:${x.id}})">Eliminar</button></div>`).join(''):'<span class="muted">No hay alarmas.</span>'}
function addAlarm(){if(!$('alarmTime').value)return;cmd('add_alarm',{time:$('alarmTime').value});$('alarmTime').value=''}
function setTime(){const v=$('dateTime').value;if(!v)return;$('msg').textContent='Enviando...';cmd('set_time',{epoch:Math.floor(new Date(v).getTime()/1000)}).then(()=>$('msg').textContent='Hora enviada al ESP32.')}
</script>
</body></html>
